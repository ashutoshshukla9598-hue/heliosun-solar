<!DOCTYPE html>
<html>
<head>
<title>Helio Sun Solar Energy</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
font-family:Arial;
margin:0;
background:#f4f4f4;
}

header{
background:#ff7a00;
color:white;
padding:20px;
text-align:center;
font-size:26px;
}

.hero{
background:white;
padding:30px;
text-align:center;
}

.container{
max-width:420px;
margin:auto;
padding:20px;
}

.box{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
text-align:center;
margin-bottom:20px;
}

input{
width:90%;
padding:12px;
margin:8px;
border:1px solid #ccc;
border-radius:5px;
}

button{
background:#ff7a00;
color:white;
border:none;
padding:12px;
width:95%;
font-size:16px;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#e06600;
}

.result{
margin-top:20px;
font-size:18px;
}

.features{
background:white;
padding:30px;
text-align:center;
}

footer{
background:#222;
color:white;
text-align:center;
padding:15px;
}

.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
color:white;
padding:15px;
border-radius:50%;
text-decoration:none;
font-size:20px;
}

</style>

</head>

<body>

<header>
Helio Sun Solar Energy
</header>

<div class="hero">

<h2>Solar Calculator</h2>

<p>Check solar system size, subsidy and savings</p>

</div>

<div class="container">

<div class="box">

<input type="number" id="bill" placeholder="Enter Monthly Electricity Bill ₹">

<button onclick="calculate()">Calculate</button>

<div class="result" id="result"></div>

</div>

<div class="box">

<h3>Get Free Solar Quote</h3>

<input type="text" id="name" placeholder="Your Name">

<input type="tel" id="phone" placeholder="Phone Number">

<input type="text" id="city" placeholder="City">

<button onclick="sendLead()">Submit</button>

</div>

</div>

<div class="features">

<h2>Why Install Solar?</h2>

<p>✔ Save up to 90% electricity bill</p>

<p>✔ Government subsidy available</p>

<p>✔ 25 years panel life</p>

<p>✔ Increase property value</p>

</div>

<footer>

Helio Sun Solar Energy  
<br>
Call / WhatsApp: 9118690770

</footer>

<a class="whatsapp" href="https://wa.me/919118690770">💬</a>

<script>

function calculate(){

let bill=document.getElementById("bill").value;

let system=0;
let cost=0;
let subsidy=0;

if(bill >= 200 && bill <= 999){
system = 2;
cost = 140000;
subsidy = 90000;
}

else if(bill >= 1000 && bill <= 4000){
system = 3;
cost = 180000;
subsidy = 108000;
}

else if(bill >= 4001){
system = 5;
cost = 315000;
subsidy = 108000;
}

else{
document.getElementById("result").innerHTML="Please enter valid bill amount";
return;
}

let finalcost=cost-subsidy;

let monthlySaving=bill*0.9;

let yearlySaving=monthlySaving*12;

let saving25=yearlySaving*25;

document.getElementById("result").innerHTML=

"Recommended Solar System: "+system+" kW <br><br>" +

"Estimated System Cost: ₹"+cost+" <br><br>" +

"Government Subsidy: ₹"+subsidy+" <br><br>" +

"Final Cost After Subsidy: ₹"+finalcost+" <br><br>" +

"Monthly Saving: ₹"+Math.round(monthlySaving)+" <br><br>" +

"25 Year Saving: ₹"+Math.round(saving25);

}

function sendLead(){

let name=document.getElementById("name").value;

let phone=document.getElementById("phone").value;

let city=document.getElementById("city").value;

let message="Solar Enquiry:%0AName: "+name+"%0APhone: "+phone+"%0ACity: "+city;

window.open("https://wa.me/919118690770?text="+message);

}

</script>

</body>
</html>
